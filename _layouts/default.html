<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body class="{% if page.chapter %}chapter-page{% else %}site-page{% endif %}">
    <a class="skip-link" href="#main">Hoppa till innehåll</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Medusa, startsida">Medusa</a>
      <nav class="site-nav" aria-label="Huvudnavigation">
        <a href="{{ '/' | relative_url }}">Hem</a>
        <a href="{{ '/synopsis.html' | relative_url }}">Synopsis</a>
        <a href="{{ '/chapters/' | relative_url }}">Kapitel</a>
      </nav>
    </header>

    <main id="main" class="page">
      {{ content }}
    </main>
  </body>
</html>
